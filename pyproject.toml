[project]
name = "portfolio-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "isa.bidou@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.27.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.2",
    "langchain-unstructured>=1.0.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "unstructured[all-docs]>=0.27.5",
]

[project.scripts]
portfolio-rag = "portfolio_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
